limit_req_zone $binary_remote_addr zone=smj_login_ip:1m rate=2r/m;
limit_req_zone $server_name zone=smj_login_global:1m rate=2r/s;
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name smj.stratalift.co.id;
    ssl_certificate /etc/letsencrypt/live/smj.stratalift.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smj.stratalift.co.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    location = /signin-with-chatgpt {
        limit_req zone=smj_login_ip burst=10 nodelay;
        limit_req zone=smj_login_global burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
}
